<div class="container">
  <h2>Gestion des Commandes</h2>
  <div class="alert" *ngIf="message">{{ message }}</div>

  <div class="card">
    <h3>Créer une commande</h3>
    <select [(ngModel)]="selectedClientId">
      <option value="0">-- Sélectionne un client --</option>
      <option *ngFor="let c of clients" [value]="c.id">{{ c.nom }}</option>
    </select>
    <button (click)="create()">Créer</button>
  </div>

  <div class="loading" *ngIf="loading">⏳ Chargement...</div>

  <table *ngIf="!loading">
    <thead>
      <tr>
        <th>ID</th><th>Client</th><th>Date</th><th>Montant</th><th>Statut</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of commandes">
        <td>{{ c.id }}</td>
        <td>{{ c.client.nom }}</td>
        <td>{{ c.dateCommande | date:'dd/MM/yyyy' }}</td>
        <td>{{ c.montantTotal }} DT</td>
        <td>
          <select [(ngModel)]="c.statut" (change)="updateStatut(c.id!, c.statut!)">
            <option *ngFor="let s of statutOptions" [value]="s">{{ s }}</option>
          </select>
        </td>
        <td>
          <button (click)="delete(c.id!)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && commandes.length === 0">Aucune commande trouvée.</p>
</div>
